# Per-pair release configuration -- the ONE place that says which container, box, address and
# release root belongs to which pair. Everything in qmesh/release/ reads this; no script may pick a
# container, port or address by hand (that habit is what let tonight's drift happen).
#
#   pair  p7ct           gpu  seam_dev      gid  gxgid  peer_ip     gx_mgmt     gxct        release_root             port   buckets  p7_arch  gx_arch  load_margin  ws_rows
#
# buckets   the row buckets the GX server grants. Prefill pieces are 8192 rows, so the grant has to
#           carry 8192; 256/2048 were only ever reachable through the old list, and each step widens
#           the workspace the server reserves even when nobody asks for it.
# ws_rows   the piece a call is split into (pinned here, not per image: see pair_lib.sh).
# Supply site-specific rows via PAIR_CONF; do not put deployment addresses in this template.
#
# RULE: every container name below belongs to exactly ONE pair, and no other queue's job may exec
# into it. One shared client container for both GPUs is what let a dev update SIGKILL prod arms
# (2026-11-01 09:39/09:46): the updater re-created seam-p7v2 while GPU0 arms ran inside it.
# pair_containers.py enforces this: it refuses to touch a container named by another pair or by a
# live ticket. A pair owns containers of its own: prod's arms keep running in seam-p7v2/seam-gx1b,
# which are NOT in this file and are never re-created, stopped or exec'd by this tooling.
#
# p7ct   container on P7 that runs the client half (mounts <release_root> at /pair)
# gpu    CUDA_VISIBLE_DEVICES for that container; never the other pair's index (GPU 2 is not ours)
# seam_dev/gid  P7 side RDMA device + gid for the seam (the client half)
# gxgid         gid on the GX data NIC the server half binds (GX_DEV is the box's default device)
# peer_ip       GX data-plane address the client dials (the server binds it)
# gx_mgmt       ssh target for the GX box (management network)
# gxct   container on the GX box that runs the server half (mounts <release_root> at /pair)
# release_root  per-pair release root, same path on P7 and on the GX box:
#                 <root>/releases/<sha>/{src,ext,RELEASE.json}   <root>/current -> releases/<sha>
#                 <root>/extcache -> releases/<sha>/ext
